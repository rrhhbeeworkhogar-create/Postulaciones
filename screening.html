<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Screening telefónico · BeeWork Hogar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --terracota: #C1642F;
    --terracota-claro: #F6E7DB;
    --cafe: #5C4A3A;
    --cafe-suave: #8A7664;
    --arena: #EFE4D3;
    --arena-osc: #E4D2B8;
    --blanco: #FFFDF9;
    --verde: #4F7A4A;
    --verde-claro: #E3EEDD;
    --amarillo-claro: #FBF0CF;
    --rojo: #A63D2F;
    --rojo-claro: #F6DCD6;
    --radio: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: var(--arena);
    color: var(--cafe);
    font-size: 15px;
    line-height: 1.55;
  }
  .contenedor { max-width: 760px; margin: 0 auto; padding: 20px 16px 120px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  header svg { width: 56px; height: 46px; flex-shrink: 0; }
  .marca { font-weight: 700; letter-spacing: 0.08em; font-size: 13px; color: var(--terracota); }
  h1 { margin: 0; font-size: 22px; line-height: 1.25; }
  .tarjeta {
    background: var(--blanco);
    border-radius: var(--radio);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(92, 74, 58, 0.10);
  }
  .tarjeta h2 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tarjeta h3 { margin: 16px 0 6px; font-size: 15px; }
  .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--terracota); color: var(--blanco);
    font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  .tiempo { font-size: 12px; font-weight: 500; color: var(--cafe-suave); background: var(--arena); border-radius: 999px; padding: 2px 10px; }
  .etapa { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--cafe-suave); margin: 26px 4px 8px; text-transform: uppercase; }
  .sub { color: var(--cafe-suave); font-size: 13px; margin: 0 0 14px; }
  .leer {
    background: var(--arena-osc);
    border-left: 4px solid var(--terracota);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 10px 0 12px;
    font-size: 15px;
  }
  .leer::before { content: "🗣️ Leé en voz alta"; display: block; font-size: 12px; font-weight: 600; color: var(--terracota); margin-bottom: 4px; }
  .tip { font-size: 13px; color: var(--cafe-suave); margin: 6px 0 10px; }
  .tip b { color: var(--cafe); }
  .repregunta { font-size: 13px; color: var(--cafe); background: var(--arena); border-radius: 8px; padding: 8px 12px; margin: 6px 0 10px; }
  .repregunta::before { content: "🔁 Si responde muy corto: "; font-weight: 600; }
  .copiar { background: var(--arena); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 6px 0 10px; }
  ul.lista { margin: 6px 0 0; padding-left: 20px; }
  ul.lista li { margin-bottom: 4px; }
  .pregunta { border-top: 1px solid var(--arena-osc); padding-top: 16px; margin-top: 16px; }
  .pregunta:first-of-type { border-top: none; padding-top: 0; margin-top: 4px; }
  .pregunta-titulo { font-weight: 600; margin-bottom: 2px; }
  .etiqueta-info { font-size: 11px; font-weight: 600; color: var(--cafe-suave); background: var(--arena); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; }
  .opciones { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .opciones.fila { flex-direction: row; flex-wrap: wrap; }
  .opciones.fila .opt { flex: 1 1 140px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start;
    border: 1.5px solid var(--arena-osc);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    background: var(--blanco);
    transition: border-color 0.15s, background 0.15s;
  }
  .opt:hover { border-color: var(--terracota); }
  .opt input { margin-top: 4px; accent-color: var(--terracota); flex-shrink: 0; }
  .opt.sel { border-color: var(--terracota); background: var(--terracota-claro); }
  .opt-t { font-weight: 500; }
  .opt-d { display: block; font-size: 13px; color: var(--cafe-suave); }
  label.campo { display: block; font-weight: 500; font-size: 14px; margin: 12px 0 4px; }
  input[type=text], input[type=tel], input[type=password], select, textarea {
    width: 100%;
    font-family: inherit; font-size: 15px; color: var(--cafe);
    border: 1.5px solid var(--arena-osc); border-radius: 10px;
    padding: 10px 12px; background: var(--blanco);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--terracota); }
  textarea { min-height: 80px; resize: vertical; }
  .fila-campos { display: flex; gap: 12px; flex-wrap: wrap; }
  .fila-campos > div { flex: 1 1 200px; }
  .dni-fila { display: flex; gap: 8px; }
  .dni-fila input { flex: 1; }
  button {
    font-family: inherit; font-size: 15px; font-weight: 600;
    border: none; border-radius: 10px; padding: 11px 18px; cursor: pointer;
  }
  .btn { background: var(--terracota); color: var(--blanco); }
  .btn:hover { background: #A9542A; }
  .btn:disabled { opacity: 0.6; cursor: wait; }
  .btn-sec { background: var(--arena-osc); color: var(--cafe); }
  .btn-sec:hover { background: #D9C3A4; }
  .aviso { border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 14px; }
  .aviso.ok { background: var(--verde-claro); color: var(--verde); }
  .aviso.warn { background: var(--amarillo-claro); color: var(--cafe); }
  .aviso.mal { background: var(--rojo-claro); color: var(--rojo); }
  .oculto { display: none !important; }
  .checks label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
  .checks input { margin-top: 5px; accent-color: var(--terracota); }
  .resumen-total { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 2px; }
  .resumen-total .grande { font-size: 44px; font-weight: 700; color: var(--terracota); line-height: 1; }
  .resultado { display: inline-block; font-weight: 600; padding: 6px 14px; border-radius: 999px; margin: 6px 0 12px; }
  .resultado.r-ok { background: var(--verde-claro); color: var(--verde); }
  .resultado.r-res { background: var(--amarillo-claro); color: var(--cafe); }
  .resultado.r-no { background: var(--rojo-claro); color: var(--rojo); }
  table.sub-tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.sub-tabla td { padding: 6px 0; border-bottom: 1px solid var(--arena-osc); }
  table.sub-tabla td:last-child { text-align: right; font-weight: 600; }
  .barra {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--cafe); color: var(--arena);
    padding: 10px 16px; font-size: 13px; z-index: 10;
  }
  .barra-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .progreso { flex: 1; height: 8px; background: rgba(239, 228, 211, 0.25); border-radius: 999px; overflow: hidden; }
  .progreso div { height: 100%; width: 0; background: var(--terracota); transition: width 0.2s; }
  .faq dt { font-weight: 600; margin-top: 10px; }
  .faq dd { margin: 2px 0 0; }
  @media (max-width: 480px) {
    h1 { font-size: 19px; }
    .tarjeta { padding: 16px; }
  }
</style>
</head>
<body>
<div class="contenedor">

  <header>
    <svg viewBox="-50 -40 100 80" aria-hidden="true">
      <polygon points="-12,0 -21,15.59 -39,15.59 -48,0 -39,-15.59 -21,-15.59" fill="none" stroke="#5C4A3A" stroke-width="3"/>
      <polygon points="18,-17.32 9,-1.73 -9,-1.73 -18,-17.32 -9,-32.91 9,-32.91" fill="#C1642F"/>
      <polygon points="18,17.32 9,32.91 -9,32.91 -18,17.32 -9,1.73 9,1.73" fill="#5C4A3A"/>
      <polygon points="48,0 39,15.59 21,15.59 12,0 21,-15.59 39,-15.59" fill="none" stroke="#5C4A3A" stroke-width="3"/>
    </svg>
    <div>
      <div class="marca">BEEWORK HOGAR</div>
      <h1>Guía de screening telefónico</h1>
    </div>
  </header>

  <section class="tarjeta" id="bloqueo">
    <h2>🔒 Acceso del equipo</h2>
    <p class="sub">Esta guía es solo para el equipo de BeeWork Hogar. Escribí la clave que te pasó la Dirección.</p>
    <label class="campo" for="claveAcceso">Clave de acceso</label>
    <input type="password" id="claveAcceso" autocomplete="off" placeholder="Te la pasa la Dirección">
    <div style="margin-top:14px"><button type="button" class="btn" id="btnEntrar">Entrar</button></div>
    <div id="avisoAcceso"></div>
  </section>

  <div id="app"></div>
</div>
<div id="appBarra"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby1ItyrMkB7lpfnGblhUf44mg1KQIXvS9v7etInukkmUuHh54QzwbH8DCgspHqBB4hhLw/exec';

(function () {
  const caja = document.getElementById('claveAcceso');
  const aviso = document.getElementById('avisoAcceso');
  const boton = document.getElementById('btnEntrar');
  function leer(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function grabar(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }

  async function entrar(clave, automatico) {
    if (!clave) { aviso.innerHTML = '<div class="aviso warn">Escribí la clave.</div>'; return; }
    boton.disabled = true;
    aviso.innerHTML = '<div class="aviso warn">Abriendo la guía...</div>';
    try {
      const r = await fetch(API_URL + '?accion=guia&clave=' + encodeURIComponent(clave));
      const res = await r.json();
      if (!res.ok) {
        grabar('bw_clave', '');
        aviso.innerHTML = automatico ? '' : '<div class="aviso mal">La clave no es correcta.</div>';
        return;
      }
      grabar('bw_clave', clave);
      window.BW_CLAVE = clave;
      document.getElementById('bloqueo').remove();
      document.getElementById('app').innerHTML = res.html;
      document.getElementById('appBarra').innerHTML = res.barra;
      new Function(res.js)();
    } catch (e) {
      aviso.innerHTML = '<div class="aviso mal">No se pudo conectar. Revisá tu conexión e intentá de nuevo.</div>';
    } finally {
      boton.disabled = false;
    }
  }

  boton.addEventListener('click', function () { entrar(caja.value.trim(), false); });
  caja.addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(caja.value.trim(), false); });
  const guardada = leer('bw_clave');
  if (guardada) entrar(guardada, true);
})();
</script>
</body>
</html>
